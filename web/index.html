<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the page reaches under the notch; style.css pays
     that back with env(safe-area-inset-*) padding. user-scalable=no because a
     pinch-zoom on a fixed landscape table only ever loses the controls. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12100f">
<title>Legends Poker</title>
<link rel="icon" href="data:,">
</head>
<body>

<!-- Landscape is locked (design doc). Four opponents + dealer + your seat +
     board + controls does not fit portrait, so say so rather than reflow.
     Static markup, not React: it has to be right before any JS runs. -->
<div id="rotate"><p>Rotate your device.<br><small>Legends Poker is landscape only.</small></p></div>

<div id="root"></div>
<script type="module" src="/main.tsx"></script>
</body>
</html>
